<!DOCTYPE html>
<html lang="it">
  <head>
    <!-- Charset -->
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Open Library Angular – Cerca libri per categoria</title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="Open Library Angular è un'app sviluppata in Angular per cercare libri per categoria usando le API di Open Library e leggere la descrizione completa di ogni opera."
    />

    <!-- Canonical (temporaneo: punta alla repo finché non deployi su Firebase) -->
    <link
      rel="canonical"
      href="https://github.com/AntonioDS1/html-open-library-angular"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://github.com/AntonioDS1/html-open-library-angular"
    />
    <meta property="og:title" content="Open Library Angular – Cerca libri per categoria" />
    <meta
      property="og:description"
      content="Cerca libri per categoria (fantasy, horror, romance...) e apri la descrizione completa grazie alle API di Open Library."
    />

    <!-- OG Image  -->
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/AntonioDS1/html-open-library-angular/main/public/og-image.png"
    />
    <meta property="og:site_name" content="Open Library Angular" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:url"
      content="https://github.com/AntonioDS1/html-open-library-angular"
    />
    <meta name="twitter:title" content="Open Library Angular – Cerca libri per categoria" />
    <meta
      name="twitter:description"
      content="Un'app Angular che usa Open Library: cerca opere per categoria e leggi la descrizione completa dei libri."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/AntonioDS1/html-open-library-angular/main/public/og-image.png"
    />
    <meta name="twitter:creator" content="@openlibrary" />

    <!-- Theme color (vintage library) -->
    <meta name="theme-color" content="#2b211a" />

    <!-- Icon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
